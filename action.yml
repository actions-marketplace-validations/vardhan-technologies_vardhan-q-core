name: 'Vardhan Q-Core Cryptographic Gate & Security Audit'
description: 'Official GitHub Action for Vardhan Q-Core. Audits codebases for post-quantum readiness (NIST FIPS 203 ML-KEM, FIPS 204 ML-DSA-87, AER-KEP-Q) and DORA Article 9 compliance.'
author: 'Vardhan Technologies (Burri Vishnu Vardhan)'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  path:
    description: 'Root directory to audit for cryptographic primitives and key agility'
    required: false
    default: '.'
  fail-on-vulnerable:
    description: 'Fail the GitHub workflow run if critical deprecated classical algorithms (RSA/ECC) or DORA key hygiene violations are detected'
    required: false
    default: 'false'
  min-pqc-score:
    description: 'Minimum Post-Quantum Readiness Score (0-100) required to pass the gate'
    required: false
    default: '0'
  ignore-paths:
    description: 'Comma-separated directory or file patterns to ignore during scanning'
    required: false
    default: 'node_modules,dist,build,target,.git,coverage,vendor'

outputs:
  pqc-score:
    description: 'Computed Post-Quantum Readiness Score (0 - 100%)'
  classical-count:
    description: 'Total number of vulnerable classical cryptographic primitives found'
  pqc-count:
    description: 'Total number of post-quantum cryptographic primitives detected'
  fips204-compliant:
    description: 'Whether digital signatures adhere to NIST FIPS 204 ML-DSA-87 standards (true/false)'
  aer-kep-q-compliant:
    description: 'Whether key exchange utilizes exposure-resilient epoch lifecycle (true/false)'
  dora-compliant:
    description: 'Whether key agility and cryptographic inventory pass DORA Chapter II Article 9 resilience checks (true/false)'
  report-json:
    description: 'Full structured cryptographic audit report in JSON format'

runs:
  using: 'node20'
  main: 'index.js'
