name: 'Vardhan Q-Core'
description: 'Sovereign post-quantum cryptographic discovery engine, CycloneDX 1.6 CBOM generator, and DORA Article 9 compliance auditor.'
author: 'Vardhan Technologies'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  path:
    description: 'Root directory to audit for cryptographic primitives and key agility'
    required: false
    default: '.'
  fail_on_vulnerable:
    description: 'Fail the workflow if critical quantum-vulnerable classical algorithms (RSA/ECC) are detected'
    required: false
    default: 'false'
  fail-on-vulnerable:
    description: 'Alias for fail_on_vulnerable'
    required: false
    default: 'false'
  min_pqc_score:
    description: 'Minimum Post-Quantum Readiness Score (0-100) required to pass the gate'
    required: false
    default: '0'
  min-pqc-score:
    description: 'Alias for min_pqc_score'
    required: false
    default: '0'
  ignore_paths:
    description: 'Comma-separated directory or file patterns to ignore during scanning'
    required: false
    default: 'node_modules,dist,build,target,.git,coverage,vendor'
  ignore-paths:
    description: 'Alias for ignore_paths'
    required: false
    default: 'node_modules,dist,build,target,.git,coverage,vendor'

outputs:
  pqc_score:
    description: 'Computed Post-Quantum Readiness Score (0 - 100%)'
  pqc-score:
    description: 'Alias for pqc_score'
  classical_count:
    description: 'Total number of vulnerable classical cryptographic primitives found'
  classical-count:
    description: 'Alias for classical_count'
  quantum_vulnerable_count:
    description: 'Number of quantum-vulnerable assets detected'
  pqc_count:
    description: 'Total number of post-quantum cryptographic primitives detected'
  pqc-count:
    description: 'Alias for pqc_count'
  cbom_file:
    description: 'Path to generated CycloneDX 1.6 Cryptographic Bill of Materials (cbom.json)'
  cbom-file:
    description: 'Alias for cbom_file'
  sarif_file:
    description: 'Path to generated OASIS SARIF 2.1.0 security report (results.sarif)'
  sarif-file:
    description: 'Alias for sarif_file'
  report_file:
    description: 'Path to full structured JSON audit inventory (report.json)'
  report-file:
    description: 'Alias for report_file'

runs:
  using: 'node20'
  main: 'index.js'
