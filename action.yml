name: 'Vardhan Q-Core'
description: 'Post-quantum cryptographic security gate auditing codebases for NIST FIPS 203/204 and DORA compliance.'
author: 'Burri Vishnu Vardhan'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  path:
    description: 'Root directory to audit for cryptographic primitives and key agility'
    required: false
    default: '.'
  fail_on_vulnerable:
    description: 'Fail the GitHub workflow run if critical deprecated classical algorithms (RSA/ECC) are detected'
    required: false
    default: 'false'
  fail-on-vulnerable:
    description: 'Alias for fail_on_vulnerable'
    required: false
    default: 'false'
  min_pqc_score:
    description: 'Minimum Post-Quantum Readiness Score (0-100) required to pass the gate'
    required: false
    default: '0'
  min-pqc-score:
    description: 'Alias for min_pqc_score'
    required: false
    default: '0'
  ignore_paths:
    description: 'Comma-separated directory or file patterns to ignore during scanning'
    required: false
    default: 'node_modules,dist,build,target,.git,coverage,vendor'
  ignore-paths:
    description: 'Alias for ignore_paths'
    required: false
    default: 'node_modules,dist,build,target,.git,coverage,vendor'

outputs:
  pqc_score:
    description: 'Computed Post-Quantum Readiness Score (0 - 100%)'
  pqc-score:
    description: 'Alias for pqc_score'
  classical_count:
    description: 'Total number of vulnerable classical cryptographic primitives found'
  classical-count:
    description: 'Alias for classical_count'
  pqc_count:
    description: 'Total number of post-quantum cryptographic primitives detected'
  pqc-count:
    description: 'Alias for pqc_count'
  dora_gaps:
    description: 'Number of DORA Article 9 compliance gaps detected'
  dora-gaps:
    description: 'Alias for dora_gaps'
  report:
    description: 'Path to full structured cryptographic audit report'

runs:
  using: 'node20'
  main: 'index.js'
