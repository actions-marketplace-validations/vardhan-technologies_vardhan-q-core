name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Unit Tests & Self-Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Test Suite
        run: node test/test.js

      - name: Self-Scan Action
        uses: ./
        with:
          path: '.'
          fail-on-vulnerable: 'false'
          min-pqc-score: '0'
